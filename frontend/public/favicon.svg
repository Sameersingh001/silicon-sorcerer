<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Glow Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Magic Gold / Amber Gradient -->
    <linearGradient id="magicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Sorcerer Core Gradient -->
    <linearGradient id="sorcererGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="498" height="498" x="7" y="7" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.88" />

  <!-- QR Target Finder Pattern: Top-Left -->
  <rect x="64" y="64" width="102" height="102" rx="22" fill="none" stroke="#818cf8" stroke-width="16" />
  <rect x="91" y="91" width="48" height="48" rx="10" fill="#38bdf8" />

  <!-- QR Target Finder Pattern: Top-Right -->
  <rect x="346" y="64" width="102" height="102" rx="22" fill="none" stroke="#818cf8" stroke-width="16" />
  <rect x="373" y="91" width="48" height="48" rx="10" fill="#c084fc" />

  <!-- QR Target Finder Pattern: Bottom-Left -->
  <rect x="64" y="346" width="102" height="102" rx="22" fill="none" stroke="#818cf8" stroke-width="16" />
  <rect x="91" y="373" width="48" height="48" rx="10" fill="#38bdf8" />

  <!-- QR Matrix Circuit Blocks: Bottom-Right -->
  <rect x="346" y="346" width="44" height="44" rx="10" fill="#818cf8" opacity="0.9" />
  <rect x="404" y="346" width="44" height="44" rx="10" fill="#38bdf8" opacity="0.9" />
  <rect x="346" y="404" width="44" height="44" rx="10" fill="#c084fc" opacity="0.9" />
  <rect x="404" y="404" width="44" height="44" rx="10" fill="#f59e0b" opacity="0.9" />

  <!-- Circuit Connection Traces -->
  <path d="M166 115 H214 V176" fill="none" stroke="url(#borderGrad)" stroke-width="7" stroke-linecap="round" opacity="0.5" />
  <path d="M346 115 H298 V176" fill="none" stroke="url(#borderGrad)" stroke-width="7" stroke-linecap="round" opacity="0.5" />
  <path d="M115 166 V224" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.45" />
  <path d="M115 346 V288" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.45" />

  <!-- Central Sorcerer & Tech Emblem -->
  <g filter="url(#softGlow)">
    <!-- Wizard Hat Cone -->
    <path d="M256 112 L348 300 Q256 318 164 300 Z" fill="url(#sorcererGrad)" />

    <!-- Hat Brim (Curved mystical 3D brim) -->
    <path d="M130 306 Q256 344 382 306 Q406 324 370 338 Q256 372 142 338 Q106 324 130 306 Z" fill="url(#sorcererGrad)" stroke="#c084fc" stroke-width="4" />

    <!-- Hat Mystic Golden Band -->
    <path d="M178 288 Q256 308 334 288 L339 304 Q256 324 173 304 Z" fill="url(#magicGold)" />

    <!-- Sorcerer's Radiant Star on Tip of Hat -->
    <path d="M256 74 Q256 104 240 112 Q256 120 256 150 Q256 120 272 112 Q256 104 256 74 Z" fill="url(#magicGold)" />
    <circle cx="256" cy="112" r="7" fill="#ffffff" />

    <!-- Magical Sparkles -->
    <path d="M378 196 Q378 214 368 220 Q378 226 378 244 Q378 226 388 220 Q378 214 378 196 Z" fill="#38bdf8" />
    <circle cx="378" cy="220" r="3.5" fill="#ffffff" />

    <!-- Cyber Lightning Sigil in the center of the hat -->
    <path d="M263 194 L244 240 H267 L249 284 L278 232 H255 Z" fill="#ffffff" />
  </g>
</svg>